            DDHH: "bg-blue-600 border border-blue-400/30 shadow-blue-900/50",
            DIH: "bg-red-600 border border-red-400/30 shadow-red-900/50",
            DICA: "bg-emerald-600 border border-emerald-400/30 shadow-emerald-900/50",
            SIMBOLO: "bg-purple-600 border border-purple-400/30 shadow-purple-900/50",
            DILEMA: "bg-orange-600 border border-orange-400/30 shadow-orange-900/50"
        };

        function initQuiz() {
            currentQuestion = 0;
            score = 0;
            correctAnswersCount = 0;
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('flex');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            selectedOptionIndex = null;

            // Header UI Updates
            document.getElementById('q-current').innerText = currentQuestion + 1;
            document.getElementById('score').innerText = score + " pts";
            
            // Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Badge
            const badgeEl = document.getElementById('badge');
            badgeEl.innerText = q.catName || q.cat;
            badgeEl.className = `inline-flex items-center px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider text-white shadow-sm transition-all duration-200 ${badgeColors[q.cat] || 'bg-slate-700'}`;

            // Question Text
            document.getElementById('question-text').innerText = q.q;

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.opts.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-950/70 hover:bg-slate-800/80 hover:border-slate-700 text-slate-200 font-medium text-sm sm:text-base transition-all duration-150 flex items-start gap-3 group`;
                btn.onclick = () => selectOption(index);
                btn.innerHTML = `
                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-slate-800 text-slate-400 text-xs font-bold shrink-0 group-hover:bg-slate-700 group-hover:text-white transition-colors">
                        ${String.fromCharCode(65 + index)}
                    </span>
                    <span class="leading-snug">${optText}</span>
                `;
                container.appendChild(btn);
            });

            // Feedback & Next Button Reset
            const fbPanel = document.getElementById('feedback-panel');
            fbPanel.classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(index) {
            if (selectedOptionIndex !== null) return; // Prevent re-selection
            selectedOptionIndex = index;

            const q = questions[currentQuestion];
            const isCorrect = (index === q.ans);
            const container = document.getElementById('options-container');
            const buttons = container.querySelectorAll('button');

            // Disable all buttons
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score += 100;
                correctAnswersCount++;
                document.getElementById('score').innerText = score + " pts";

                buttons[index].className = `w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-950/40 text-emerald-100 font-medium text-sm sm:text-base flex items-start gap-3 shadow-lg shadow-emerald-950/50`;
                buttons[index].querySelector('span').className = `inline-flex items-center justify-center w-6 h-6 rounded-lg bg-emerald-500 text-slate-950 text-xs font-black shrink-0`;
            } else {
                buttons[index].className = `w-full text-left p-4 rounded-xl border-2 border-red-500 bg-red-950/40 text-red-100 font-medium text-sm sm:text-base flex items-start gap-3 shadow-lg shadow-red-950/50`;
                buttons[index].querySelector('span').className = `inline-flex items-center justify-center w-6 h-6 rounded-lg bg-red-500 text-white text-xs font-black shrink-0`;

                // Highlight Correct Option
                buttons[q.ans].className = `w-full text-left p-4 rounded-xl border border-emerald-500/80 bg-emerald-950/20 text-emerald-200 font-medium text-sm sm:text-base flex items-start gap-3`;
            }

            // Show Feedback
            showFeedback(isCorrect, q.exp);

            // Show Next Button
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function showFeedback(isCorrect, explanation) {
            const panel = document.getElementById('feedback-panel');
            const title = document.getElementById('feedback-title');
            const text = document.getElementById('feedback-text');

            panel.classList.remove('hidden');

            if (isCorrect) {
                panel.className = "rounded-xl p-4 sm:p-5 border text-sm leading-relaxed mb-6 bg-emerald-950/30 border-emerald-800/60 text-slate-200";
                title.className = "font-bold text-base mb-1 flex items-center gap-2 text-emerald-400";
                title.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    <span>¡Respuesta Correcta! (+100 pts)</span>
                `;
            } else {
                panel.className = "rounded-xl p-4 sm:p-5 border text-sm leading-relaxed mb-6 bg-red-950/30 border-red-800/60 text-slate-200";
                title.className = "font-bold text-base mb-1 flex items-center gap-2 text-red-400";
                title.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                    <span>Respuesta Incorrecta</span>
                `;
            }

            text.innerText = explanation;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = correctAnswersCount;

            const badgeEl = document.getElementById('result-badge');
            const msgEl = document.getElementById('eval-message');

            if (score >= 1800) {
                badgeEl.innerText = "🎖️";
                msgEl.innerHTML = "<strong class='text-emerald-400 block mb-1 text-base'>Nivel: Excelencia Operativa</strong>Demuestras un dominio profesional de los principios de DDHH, DIH, DICA y Simbología de Protección. Apto para el planeamiento y conducción de operaciones con estricta legitimidad.";
            } else if (score >= 1300) {
                badgeEl.innerText = "⭐";
                msgEl.innerHTML = "<strong class='text-amber-400 block mb-1 text-base'>Nivel: Aprobado / Desempeño Satisfactorio</strong>Tienes claros los conceptos y símbolos esenciales. Se sugiere repasar los dilemas operativos complejos en materia de proporcionalidad y el uso gradual de la fuerza.";
            } else {
                badgeEl.innerText = "⚠️";
                msgEl.innerHTML = "<strong class='text-red-400 block mb-1 text-base'>Nivel: Requiere Repaso Urgente</strong>Tu puntaje refleja dudas en la aplicación de la normativa operacional. Es necesario reforzar el estudio de los Convenios de Ginebra, la simbología de protección y las Reglas de Uso de la Fuerza.";
            }
        }

        function restartQuiz() {
            initQuiz();
        }

        // Start App
        window.onload = initQuiz;
    </script>
</body>
</html>
